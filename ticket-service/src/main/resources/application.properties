spring.application.name=ticket-service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados}
spring.datasource.username=${DB_USER:chamados}
spring.datasource.password=${DB_PASSWORD:chamados_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
