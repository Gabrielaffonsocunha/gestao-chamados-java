services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamados_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d chamados"]
      interval: 5s
      timeout: 3s
      retries: 15

  ticket-service:
    build:
      context: .
      dockerfile: ticket-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chamados
      DB_USER: chamados
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chamados_dev}
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8082

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ticket-service
      - notification-service

volumes:
  postgres-data:
